services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurelia
      POSTGRES_USER: aurelia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurelia-local-only}
    ports:
      - "5432:5432"
    volumes:
      - aurelia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurelia -d aurelia"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  aurelia-postgres:
